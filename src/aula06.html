<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <div class="flex flex-col m-8 gap-8">
        <!-- tamanho absoluto-->
        <div class="flex flex-col bg-pink-200 gap-2">
            <div class="h-6 w-4 bg-cyan-700">01</div>
            <div class="h-6 w-16 bg-cyan-700">02</div>
            <div class="h-6 w-32 bg-cyan-700">03</div>
            <div class="h-6 w-48 bg-cyan-700">04</div>
        </div>

        <!-- tamanho relativo-->
        <div class="flex flex-col bg-pink-200 gap-2">
            <div class="h-6 w-1/4 bg-cyan-700">01</div>
            <div class="h-6 w-1/3 bg-cyan-700">02</div>
            <div class="h-6 w-1/2 bg-cyan-700">03</div>
            <div class="h-6 w-2/3 bg-cyan-700">04</div>
        </div>
        <!-- tamanho relativo : horizontal-->
        <div class="flex flex-row bg-pink-200 gap-2">
            <div class="h-6 w-1/5 bg-cyan-700">01</div>
            <div class="h-6 w-1/5 bg-cyan-700">02</div>
            <div class="h-6 w-2/5 bg-cyan-700">03</div>
            <div class="h-6 w-1/5 bg-cyan-700">04</div>
        </div>

        <div class="flex flex-col bg-pink-200 gap-2">
            <div class="h-6 w-auto bg-cyan-700">01</div>
            <div class="h-6 w-full  bg-cyan-700">02</div>
            <div class="h-6  bg-cyan-700">03</div>
        </div>

        <!-- Largura mínima col-->
        <div class="flex flex-col w-24 p-1 bg-pink-700 gap-2">
            <div class="h-6 min-w-28 bg-cyan-700">01</div>
            <div class="h-6 w-full  bg-cyan-700">02</div>
        </div>
 <!-- Largura mínima  linha-->
        <div class="flex flex-row p-1 bg-pink-700 gap-2">
            <div class="h-6 w-full bg-cyan-700">01</div>
            <div class="h-6 min-w-1/3  bg-cyan-700">02</div>
        </div>


        <!-- Largura maxima col-->
        <div class="flex flex-col p-1 bg-pink-700 gap-2">
            <div class="h-6 w-full max-w-150 bg-cyan-700">01</div>
        </div>

        <!-- Size e altura-->
        <div class="flex flex-row p-1 bg-pink-700 gap-2">
            <div class="h-6 w-6  max-w-150 bg-cyan-700">01</div>
            <div class="size-12 max-w-150 bg-cyan-700">01</div>
            <div class="size-12 max-w-150 bg-cyan-700">01</div>
        </div>

        
    </div>
</body>
</html>
