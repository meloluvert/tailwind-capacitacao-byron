<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Aula 02</title>
  </head>
  <body>
    <div class="bg-cyan-800">
      <h1 class="text-3xl text-red-950">Hello world!</h1>
      <h2 class="text-2xl text-fuchsia-400">Hello World</h2>
      <h2 class="text-xl">Hello World</h2>
      <h2 class="text-lg">Hello World</h2>
      <h2 class="text-base">Hello World</h2>
      <h2 class="text-sm">Hello World</h2>
    </div>
    <hr>
    <div>
      <p class="font-sans text-xl">Hello World</p>
      <p class="font-serif text-xl">Hello World</p>
      <p class="font-mono text-xl">Hello World</p>
    </div>
    <hr>
    <div>
      <p class="italic">Hello World</p>
      <p class="underline">Hello World</p>
      <p class="line-through">Hello World</p>
    </div>
    <hr>
    <div>
      <p class="font-thin">Hello World</p>
      <p class="font-bold">Hello World</p>
      <p class="font-semibold">Hello World</p>
    </div>
    <hr>
    <p class="font-bold text-3xl line-through">Helloworld</p>
